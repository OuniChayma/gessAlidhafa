<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> فواتير اخرى</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="autrefacture.component.css">
</head>
<body>

<!-- Button Group Container (For Better Spacing) -->
<div class="btn-group-container">
    <div class="d-flex justify-content-between mb-3"> <!-- d-flex for flexbox layout, justify-content-between for space between -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#operationModal">إضافة فاتورة</button>     
        <button type="button" class="btn btn-primary" [routerLink]="'/home'">رجوع</button>
    </div>
</div>

<!-- Title -->
<h1 class="header">   فواتير اخرى</h1>

<!-- Search Field -->
<div class="form-group">
    <input type="text" id="searchInput" class="form-control mb-3" placeholder="ابحث هنا..." onkeyup="filter()">
</div>

<!-- Table -->
<table class="table table-striped table-bordered">
    <thead class="table thead">
        <tr>
            <th>الرمز </th>
            <th>الشهر/التاريخ</th>
            <th>رقم الفاتورة</th>
            <th> البيان </th>
            <th>المبلغ المطلوب</th>
            <th> الملف المرفق</th>
            <th>إجراءات</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr>
            <td>1</td>
            <td>2024-12-01</td>
            <td>500</td>
            <td> <a href="#" onclick="document.getElementById('fileInput1').click(); return false;">تحميل ملف</a>
                <input type="file" id="fileInput1" style="display: none;">
             </td>
            <td>100</td>
            <td>
                <a href="#" onclick="document.getElementById('fileInput1').click(); return false;">تحميل ملف</a>
                <input type="file" id="fileInput1" style="display: none;">
            </td>
            <td><button class="btn btn-danger btn-sm">حذف</button></td>
        </tr>

    </tbody>
</table>
<!-- Add Operation Modal -->
<div class="modal fade" id="operationModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true" dir="rtl">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">إضافة فاتورة</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <form id="operationForm">
                    <div class="mb-3">
                        <label for="date" class="form-label">الشهر/التاريخ</label>
                        <input type="date" class="form-control text-end" id="date">
                    </div>
                    <div class="mb-3">
                        <label for="invoiceNumber" class="form-label">رقم الفاتورة</label>
                        <input type="text" class="form-control text-end" id="invoiceNumber">
                    </div>
                    <div class="mb-3">
                        <label for="beneficiary" class="form-label">إسم ولقب المنتفع</label>
                        <input type="text" class="form-control text-end" id="beneficiary">
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">المبلغ المطلوب</label>
                        <input type="number" class="form-control text-end" id="amount">
                    </div>
                    <div class="mb-3">
                        <label for="attachment" class="form-label">الملف المرفق</label>
                        <input type="file" class="form-control text-end" id="attachment">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="addOperation()">إضافة</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
