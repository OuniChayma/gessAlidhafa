<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>   قائمة  كشوفات الوضع المالي للمجمع    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="situationfinanciere.component.css">
</head>
<body>

<!-- Button Group Container (For Better Spacing) -->
<div class="btn-group-container">
    <div class="d-flex justify-content-between mb-3"> <!-- d-flex for flexbox layout, justify-content-between for space between -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#operationModal">إضافة كشف</button> 
        <button class="btn btn-green"[routerLink]="'/rapportsituation'">متابعة الوضعية المالية للمجمع  </button>
    
        <button type="button" class="btn btn-primary" [routerLink]="'/home'">رجوع</button>
    </div>
</div>

<!-- Title -->
<h1 class="header">     قائمة كشوفات الوضع المالي للمجمع</h1>

<!-- Search Field -->
<div class="form-group">
    <input type="text" id="searchInput" class="form-control mb-3" placeholder="ابحث هنا..." onkeyup="filter()">
</div>

<!-- Table -->
<table class="table table-striped table-bordered">
    <thead class="table thead">
        <tr>
            <th>الرمز </th>
            <th>الفترة من</th>
            <th>إلى</th>
           
           
            <th> الملف المرفق</th>
         
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr>
            <td>1</td>
            <td>2024-12-01</td>
            <td>2025-01-01</td>
            <td>
                <a href="#" onclick="document.getElementById('fileInput1').click(); return false;">تحميل ملف</a>
                <input type="file" id="fileInput1" style="display: none;">
            </td>
            <td><button class="btn btn-danger btn-sm">حذف</button></td>
        </tr>

    </tbody>
</table>
<!-- Add Operation Modal -->
<div class="modal fade" id="operationModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true" dir="rtl">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">     ملف الكشف عن الوضعية المالية للمجمع </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col">
                        <label>من</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="col">
                        <label>إلى</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="attachment" class="form-label">الملف المرفق</label>
                        <input type="file" class="form-control text-end" id="attachment">
                    </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="addOperation()">إضافة</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
