<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إضافة عطب</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ajoutpanne.component.css">
</head>
<body>
<!-- Button Group Container -->
<div class="btn-group-container">
    <div class="d-flex justify-content-between mb-3">
        <button type="button" class="btn btn-primary" [routerLink]="'/defaut'">رجوع</button>
    </div>
</div>

<!-- Title -->
<h1 class="header">إضافة عطب</h1>

<!-- Form Fields -->
<form [formGroup]="faultForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <h4>معلومات عن العطب:</h4>
  
      <p>الساكورة عدد:</p>
      <input type="text" class="form-control mb-3" formControlName="sakoura" placeholder="أدخل الساكورة عدد">
  
      <p>نوع المنتفع:</p>
      <select class="form-control mb-3" formControlName="beneficiaryType">
        <option value="">اختر نوع المنتفع</option>
        <option value="سقوي">سقوي</option>
        <option value="صالح للشرب">صالح للشرب</option>
      </select>
  
      <p>تفاصيل العطب:</p>
      <textarea class="form-control mb-3" formControlName="faultDetails" rows="3" placeholder="أدخل تفاصيل العطب"></textarea>
  
      <p>طبيعة التدخل:</p>
      <select class="form-control mb-3" formControlName="interventionType">
        <option value="">اختر طبيعة التدخل</option>
        <option value="خارجي">خارجي</option>
        <option value="محلي">محلي</option>
      </select>
  
      <p>مصاريف الإصلاح:</p>
      <input type="number" class="form-control mb-3" formControlName="repairCost" min="1" placeholder="أدخل مصاريف الإصلاح">
  
      <p>مرفقات إن وجدت:</p>
      <input type="file" class="form-control mb-3" formControlName="attachments">
  
      <p>المواد المشتراة إذا وجدت:</p>
      <input type="text" class="form-control mb-3" formControlName="purchasedMaterials" placeholder="أدخل المواد المشتراة">
  
      <p>مرفقات إضافية إن وجدت:</p>
      <input type="file" class="form-control mb-3" formControlName="additionalAttachments">
    </div>
  
    <button type="submit" class="btn btn-primary" [disabled]="!faultForm.valid">تسجيل العطب</button>
  </form>
</body>
</html>
