<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>برنامج التوزيع اليومي</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="distibution.component.css">
</head>
<body>

<!-- Button Group Container (For Better Spacing) -->
<div class="btn-group-container">
    <div class="d-flex justify-content-between mb-3"> <!-- d-flex for flexbox layout, justify-content-between for space between -->
        <button type="button" class="btn btn-primary" (click)="print()">طباعة</button>
        <button class="btn btn-green" data-bs-toggle="modal" data-bs-target="#distributionModal">إضافة </button>

        <button type="button" class="btn btn-primary" [routerLink]="'/home'">رجوع</button>
    </div>
</div>

<!-- Title -->
<h1 class="header">برنامج التوزيع اليومي</h1>

<p>تاريخ: <span>12-11-2022</span></p>
<p class="text-end">مجمع التنمية في قطاع الفلاحة والصيد البحري <br> الدري بـ: <strong>test</strong></p>


<!-- Table -->
<table class="table table-striped table-bordered">
    <thead class="table thead">
        <tr>
            <th rowspan="3">ع. ر</th>
            <th rowspan="3">فرع</th>
            <th rowspan="3">مأخذ</th>
            <th rowspan="3">اسم ولقب الفلاح</th>
            <th rowspan="3">إذن توزيع عدد</th>
            <th rowspan="3">كمية / ساعات</th>
            <th colspan="2">توقيت</th>
            <th colspan="6">التوزيع الفعلي</th>
        </tr>
        <tr>
            <th>من</th>
            <th>إلى</th>
            <th colspan="3">التوقيت</th>
            <th colspan="3">كمية / عداد</th>
        </tr>
        <tr>
            <th>من</th>
            <th>إلى</th>
            <th>عدد ساعات</th>
            <th>من</th>
            <th>إلى</th>
            <th>كمية</th>
        </tr>
    </thead>


        <tr>
            <td colspan="12">لا يوجد أي تسجيل</td>
        </tr>
    </table>
     <!-- Footer Info -->
    <div class="info-footer">
      * انقر على عرض التفاصيل
    </div>
<!-- Modal -->
<div class="modal fade" id="distributionModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="modalLabel">إضافة توزيع</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
          </div>
          <div class="modal-body">
              <form>
                  <!-- اسم ولقب الفلاح -->
                  <div class="mb-3">
                      <label class="form-label">اسم ولقب الفلاح</label>
                      <input type="text" class="form-control">
                    
                  </div>

                  <!-- فرع -->
                  <div class="mb-3">
                      <label class="form-label">فرع</label>
                      <input type="text" class="form-control">
                  </div>

                  <!-- مائدة -->
                  <div class="mb-3">
                      <label class="form-label">مائدة</label>
                      <input type="text" class="form-control">
                  </div>

                  <!-- أين توزيع عدد -->
                  <div class="mb-3">
                      <label class="form-label">أين توزيع عدد</label>
                      <input type="text" class="form-control">
                  </div>

                  <!-- كمية / ساعات -->
                  <div class="mb-3">
                      <label class="form-label">كمية / ساعات</label>
                      <input type="text" class="form-control">
                  </div>

                  <hr>

                  <!-- وقت -->
                  <div class="mb-3">
                      <label class="form-label">وقت</label>
                      <div class="row">
                          <div class="col">
                              <label>من</label>
                              <input type="time" class="form-control">
                          </div>
                          <div class="col">
                              <label>إلى</label>
                              <input type="time" class="form-control">
                          </div>
                      </div>
                  </div>

                  <hr>

                  <!-- التوزيع الفعلي -->
                  <div class="mb-3">
                      <label class="form-label">التوزيع الفعلي</label>

                      <!-- وقت -->
                      <div class="row">
                          <div class="col">
                              <label>من</label>
                              <input type="time" class="form-control">
                          </div>
                          <div class="col">
                              <label>إلى</label>
                              <input type="time" class="form-control">
                          </div>
                     
                      <div class="col">
                        <label>عدد ساعات</label>
                        <input type="text" class="form-control">
                    </div>
                </div>
                <hr>
              

                      

                      <!-- كمية / عدد -->
                      <div class="mt-2">
                          <label>كمية / عدد</label>
                          <div class="row">
                              <div class="col">
                                  <label>من</label>
                                  <input type="text" class="form-control">
                              </div>
                              <div class="col">
                                  <label>إلى</label>
                                  <input type="text" class="form-control">
                              </div>
                              <div class="col">
                                <label>كمية</label>
                                <input type="text"class="form-control">
                            </div>
                          </div>
                      </div>
                  </div>

          <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="addOperation()">إضافة</button>
                </div>

              </form>
          </div>
      </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
